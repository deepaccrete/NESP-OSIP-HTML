        rel="stylesheet" />

    <link

    <!-- Type (14 Sep 2026): Inter replaces Newsreader, as on the sector pages. The Newsreader
         stylesheet above is kept only so the shared header does not inject its own copy. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&amp;display=swap"
        rel="stylesheet" />
    <script>
        /* Redesign: hold the page title and search back for their entrance. The
           motion layer lifts this the moment its start states are applied, and it
           lifts itself after 3.5s whatever happens, so a slow or blocked CDN can
           never leave the header empty. Not set when reduced motion is asked for. */
        (function () {
            try {
                if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
                var root = document.documentElement;
                root.classList.add('rd-intro');
                setTimeout(function () { root.classList.remove('rd-intro'); }, 3500);
            } catch (e) {}
        })();
    </script>

    <style>

        }

    <style id="rd-style">
        /* =====================================================================
           REDESIGN LAYER - News.html (11 Sep 2026)

           The DetailedSector.html redesign carried to the news listing: the same
           tokens and the same direction. Headings and reading text move to
           Newsreader, a light editorial serif; interface text (dates, places,
           labels, the search field) stays sans; buttons take the serif at their
           old visual size; grounds go to warm paper; borders and shadows are
           turned down. The news cards restate the homepage's News & Updates
           items (18px image, tracked sans labels, 23px serif title, sans Read
           More), and the filter panel restates the Opportunities.html panel, so
           the pages read as one site. No content was edited. Scoped under
           body.rd; the earlier design is kept in OSIP/Backups/News/.
           ===================================================================== */
        :root {
            --rd-paper: #f5f3ee;
            --rd-paper-2: #edeae3;
            --rd-card: #fbfaf7;
            --rd-card-2: #f1eee8;
            --rd-line: #e2ded5;
            --rd-line-2: #cfc9bd;
            --rd-ink: #13201b;
            --rd-ink-2: #3d4742;
            --rd-ink-3: #6b716c;
            --rd-green: #004225;
            --rd-green-2: #0b6b45;
            --rd-deep: #0b2a1f;
            --rd-gold: #d9a520;
            --rd-serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
            --rd-sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --rd-ease: cubic-bezier(.22, 1, .36, 1);
        }

        /* ---- Lenis, from lenis@1.3.26/dist/lenis.css --------------------------- */
        html.lenis,
        html.lenis body { height: auto; }
        .lenis:not(.lenis-autoToggle).lenis-stopped { overflow: clip; }
        .lenis [data-lenis-prevent],
        .lenis [data-lenis-prevent-wheel],
        .lenis [data-lenis-prevent-touch],
        .lenis [data-lenis-prevent-vertical],
        .lenis [data-lenis-prevent-horizontal] { overscroll-behavior: contain; }
        .lenis.lenis-scrolling iframe { pointer-events: none; }
        .lenis.lenis-autoToggle {
            transition-property: overflow;
            transition-duration: 1ms;
            transition-behavior: allow-discrete;
        }
        /* The filter panel is a scrolling drawer below 1024px, so it keeps native
           wheel (data-lenis-prevent, set by the motion layer). On desktop it is a
           plain overflow:visible column, not a scroll box, so nothing freezes. */

        /* ---- Page ---------------------------------------------------------------- */
        body.rd {
            background: var(--rd-paper) !important;
            color: var(--rd-ink-2);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .rd main { font-family: var(--rd-sans) !important; font-size-adjust: none !important; }

        .rd ::selection { background: #f7be26; color: var(--rd-ink); }

        @media (min-width: 1024px) {
            .rd main {
                padding: clamp(48px, 5vw, 72px) clamp(40px, 4.5vw, 72px) clamp(72px, 8vw, 112px) !important;
            }
        }

        /* ---- Headings ------------------------------------------------------------ */
        .rd main h1,
        .rd main h2,
        .rd main h3,
        .rd main h4 {
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-optical-sizing: auto;
            text-wrap: balance;
        }

        .rd main h1 .rd-char-mask { padding: .18em; margin: -.18em; }

        /* ---- Page header: the gold bar draws, the title's letters rise ------------- */
        .rd main > div.mb-10 {
            margin-bottom: clamp(40px, 5vw, 64px) !important;
            gap: 24px !important;
        }

        .rd main > div.mb-10 > div:first-child { gap: 20px !important; }

        /* the bar is the header's gold rule: 1px, drawn downward (--rd-draw) */
        .rd main div.w-1.h-10 {
            position: relative;
            width: 1px !important;
            height: 62px !important;
            background: transparent !important;
        }

        .rd main div.w-1.h-10::before {
            content: "";
            position: absolute; inset: 0;
            background: #f7be26;
            transform: scaleY(var(--rd-draw, 1)); transform-origin: 50% 0;
        }

        .rd main h1 {
            font-weight: 300 !important;
            font-size: clamp(48px, 5.2vw, 76px) !important;
            line-height: 1 !important;
            letter-spacing: -0.032em !important;
            color: var(--rd-ink) !important;
        }

        /* Search: the Opportunities pill field */
        .rd #news-search {
            height: 50px;
            padding: 0 50px 0 22px !important;
            background: var(--rd-card) !important;
            border: 1px solid var(--rd-line-2) !important;
            border-radius: 999px !important;
            box-shadow: none !important;
            font-family: var(--rd-sans) !important; font-size-adjust: none !important;
            font-size: 14.5px !important;
            color: var(--rd-ink) !important;
            transition: border-color .35s ease, background-color .35s ease, box-shadow .35s ease !important;
        }

        .rd #news-search::placeholder { color: var(--rd-ink-3); opacity: 1; }

        .rd #news-search:focus {
            outline: none;
            background: #ffffff !important;
            border-color: var(--rd-green) !important;
            box-shadow: 0 0 0 3px rgba(0, 66, 37, .08) !important;
        }

        .rd #news-search + .material-symbols-outlined {
            top: 50% !important;
            right: 18px !important;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--rd-ink-3) !important;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            pointer-events: none;
            transition: color .35s ease;
        }

        .rd #news-search:focus + .material-symbols-outlined { color: var(--rd-green) !important; }

        /* The header waits for its entrance; see the flag script in <head>. */
        html.rd-intro main > div.mb-10 > * { opacity: 0; }

        /* Filters button (phones and tablets: opens the drawer) */
        .rd #filter-open {
            min-height: 44px;
            padding: 0 20px 0 16px !important;
            border-color: var(--rd-line-2) !important;
            border-radius: 999px !important;
            background: transparent !important;
            font-weight: 500 !important;
            color: var(--rd-green) !important;
            transition: background-color .35s ease, border-color .35s ease !important;
        }

        .rd #filter-open:hover { background: #ffffff !important; border-color: var(--rd-green) !important; }

        /* ---- News cards: the homepage News & Updates item, in a grid ---------------
           Open editorial items rather than boxed cards: the photograph carries the
           18px radius, then tracked sans labels, the serif title and the sans
           Read More link. The whole item stays clickable (the page's own script). */
        .rd #news-grid {
            column-gap: clamp(24px, 2.4vw, 36px) !important;
            row-gap: clamp(44px, 4.6vw, 64px) !important;
        }

        .rd #news-grid article,
        .rd #news-grid article:hover {
            background: transparent !important;
            border: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        .rd #news-grid article > div.aspect-video {
            border-radius: 18px !important;
            background: var(--rd-paper-2);
            isolation: isolate;
        }

        .rd #news-grid article img {
            transition: transform 1.2s var(--rd-ease) !important;
        }

        .rd #news-grid article:hover img { transform: scale(1.04) !important; }

        .rd #news-grid article > div.p-6 { padding: 22px 2px 0 !important; }

        .rd #news-grid article div.mb-3 {
            gap: 8px !important;
            margin-bottom: 12px !important;
        }

        .rd #news-grid time,
        .rd #news-grid .location-tag {
            font-family: var(--rd-sans) !important; font-size-adjust: none !important;
            font-size: 11px !important;
            font-weight: 500 !important;
            line-height: 1.4 !important;
            letter-spacing: .2em !important;
            text-transform: uppercase;
        }

        .rd #news-grid time { color: var(--rd-ink-3) !important; }
        .rd #news-grid .location-tag { gap: 5px !important; color: var(--rd-green-2) !important; }

        .rd #news-grid div.mb-3 .material-symbols-outlined {
            font-size: 15px !important;
            color: var(--rd-ink-3) !important;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
        }

        .rd #news-grid .location-tag .material-symbols-outlined { color: var(--rd-gold) !important; }

        .rd #news-grid article h3 {
            font-weight: 400 !important;
            font-size: 23px !important;
            line-height: 1.22 !important;
            letter-spacing: -0.014em !important;
            color: var(--rd-ink) !important;
            transition: color .35s ease !important;
        }

        .rd #news-grid article:hover h3 { color: var(--rd-green) !important; }

        .rd #news-grid article div.mt-auto { padding-top: 18px !important; }

        .rd #news-grid article a[href] {
            gap: 6px !important;
            font-family: var(--rd-sans) !important; font-size-adjust: none !important;
            font-size: 14px !important;
            font-weight: 500 !important;
            color: var(--rd-green) !important;
        }

        .rd #news-grid article a[href] .material-symbols-outlined {
            font-size: 18px !important;
            transition: transform .35s var(--rd-ease);
        }

        .rd #news-grid article:hover a[href] .material-symbols-outlined { transform: translateX(3px); }

        /* ---- Result count and active-filter chips (UX-SUP-03) ----------------------- */
        /* The count is the tracked-caps line Opportunities.html uses for the same job. */
        .news-count {
            margin: 0 0 12px;
            font-family: Inter, sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--rd-ink-3, #6b716c);
        }

        .news-count:empty { display: none; }

        .news-chips {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 0 0 22px;
        }

        .news-chips[hidden] { display: none; }

        .news-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 4px 0 12px;
            border: 1px solid var(--rd-line, #e2ded5);
            border-radius: 999px;
            background: var(--rd-card, #fbfaf7);
            font-family: Inter, sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--rd-ink-2, #3d4742);
            transition: border-color .25s ease;
        }

        .news-chip:hover { border-color: var(--rd-line-2, #cfc9bd); }

        .news-chip i {
            font-style: normal;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--rd-ink-3, #6b716c);
        }

        .news-chip button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            padding: 0;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--rd-ink-3, #6b716c);
            cursor: pointer;
            transition: background-color .25s ease, color .25s ease;
        }

        .news-chip button:hover {
            background: #edeae3;
            color: var(--rd-green, #004225);
        }

        .news-chip button .material-symbols-outlined { font-size: 15px; }

        .news-chips-clear {
            height: 32px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            font-family: Inter, sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--rd-green, #004225);
            cursor: pointer;
            transition: background-color .25s ease;
        }

        .news-chips-clear:hover { background: #edeae3; }

        .news-chip button:focus-visible,
        .news-chips-clear:focus-visible {
            outline: 2px solid var(--rd-green-2, #0b6b45);
            outline-offset: 2px;
        }

        /* ---- No results ------------------------------------------------------------ */
        .rd #news-empty .material-symbols-outlined {
            font-size: 44px !important;
            color: var(--rd-line-2) !important;
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 48;
        }

        .rd #news-empty p:first-of-type {
            margin-top: 14px !important;
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-weight: 400 !important;
            font-size: 28px !important;
            line-height: 1.2 !important;
            letter-spacing: -0.014em;
            color: var(--rd-ink) !important;
        }

        .rd #news-empty p + p {
            margin-top: 8px;
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-size: 17px !important;
            color: var(--rd-ink-3) !important;
        }

        /* ---- Pagination: round pagers, the current page in green ---------------------- */
        .rd main > div.mt-16 {
            gap: 8px !important;
            margin-top: clamp(56px, 6vw, 88px) !important;
        }

        .rd main > div.mt-16 > button {
            width: 44px !important;
            height: 44px !important;
            border: 1px solid var(--rd-line-2) !important;
            border-radius: 999px !important;
            background: var(--rd-card) !important;
            font-weight: 500 !important;
            color: var(--rd-ink-2) !important;
            transition: background-color .35s ease, color .35s ease, border-color .35s ease !important;
        }

        .rd main > div.mt-16 > button:hover {
            background: #ffffff !important;
            border-color: var(--rd-green) !important;
            color: var(--rd-green) !important;
        }

        .rd main > div.mt-16 > button.bg-primary-container,
        .rd main > div.mt-16 > button.bg-primary-container:hover {
            background: var(--rd-green) !important;
            border-color: var(--rd-green) !important;
            color: #ffffff !important;
        }

        .rd main > div.mt-16 > span { color: var(--rd-ink-3) !important; }

        .rd main > div.mt-16 .material-symbols-outlined {
            font-size: 20px !important;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* ---- Filter panel: the Opportunities.html panel, rule for rule ----------------- */
        .rd #filter-sidebar {
            background: var(--rd-paper-2) !important;
            border-right-color: var(--rd-line) !important;
        }

        .rd #filter-sidebar .bg-primary-container {
            border-radius: 999px;
            background: transparent !important;
            color: var(--rd-green) !important;
            box-shadow: inset 0 0 0 1px var(--rd-line-2);
        }

        .rd #filter-sidebar h2 {
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-weight: 400 !important;
            font-size: 22px !important;
            line-height: 1.15 !important;
            letter-spacing: -0.01em;
            color: var(--rd-ink) !important;
        }

        .rd #filter-sidebar h2 + p {
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-style: italic;
            font-size: 14px !important;
            color: var(--rd-ink-3) !important;
        }

        .rd #filter-sidebar section h3 {
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-size: 18px !important;
            font-weight: 500 !important;
            letter-spacing: -0.005em !important;
            text-transform: none !important;
            color: var(--rd-ink) !important;
        }

        .rd #filter-sidebar section .bg-surface-container-high {
            border-radius: 999px !important;
            background: transparent !important;
            box-shadow: inset 0 0 0 1px var(--rd-line-2);
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-size: 12.5px !important;
            font-weight: 500 !important;
            color: var(--rd-ink-3) !important;
        }

        .rd #filter-sidebar label span {
            font-family: var(--rd-serif) !important; font-size-adjust: var(--rd-type-adjust, none) !important;
            font-size: 16px !important;
            color: var(--rd-ink-2) !important;
            transition: color .25s ease;
        }

        .rd #filter-sidebar label:hover span { color: var(--rd-green) !important; }

        .rd #filter-sidebar .filter-checkbox {
            border-radius: 4px !important;
            border-color: var(--rd-line-2) !important;
            color: var(--rd-green) !important;
        }

        .rd #filter-sidebar .filter-checkbox:checked {
            background-color: var(--rd-green) !important;
            border-color: var(--rd-green) !important;

    <script>
        (function () {
            var grid = document.getElementById('news-grid');
            var list = window.OSIP_NEWS;
            if (!grid || !list || !list.length) return;
            var items = list.slice().sort(function (a, b) {
                return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0);   // newest first
            });
            grid.innerHTML = '';
            items.forEach(function (n) {
                var art = document.createElement('article');
                art.className = 'bg-surface-container-lowest border border-outline-variant border-t-4 border-t-tertiary-fixed-dim group hover:shadow-lg transition-shadow duration-300 flex flex-col';

                var media = document.createElement('div');
                media.className = 'aspect-video overflow-hidden relative shrink-0';
                var img = document.createElement('img');
                img.className = 'w-full h-full object-cover group-hover:scale-105 transition-transform duration-500';
                img.setAttribute('loading', 'lazy');
                img.setAttribute('decoding', 'async');
                img.src = n.image; img.alt = n.alt || '';
                media.appendChild(img);

                var body = document.createElement('div');
                body.className = 'p-6 flex flex-col flex-1';

                var meta = document.createElement('div');
                meta.className = 'flex items-center gap-2 mb-3';
                var cal = document.createElement('span');
                cal.className = 'material-symbols-outlined text-[16px] text-on-surface-variant';
                cal.textContent = 'calendar_today';
                var time = document.createElement('time');
                time.className = 'text-label-md text-on-surface-variant';
                time.setAttribute('datetime', n.date); time.textContent = n.display;
                meta.appendChild(cal); meta.appendChild(time);

                var h3 = document.createElement('h3');
                h3.className = 'font-h4 text-h4 text-primary leading-tight group-hover:text-secondary transition-colors';
                h3.setAttribute('data-category', (n.categories || []).join(','));
                h3.setAttribute('data-state', n.state || '');
                h3.setAttribute('data-timeline', n.timeline || '');
                h3.textContent = n.title;

                var footRow = document.createElement('div');
                footRow.className = 'mt-auto pt-6 flex justify-between items-center';
                var link = document.createElement('a');
                link.className = 'text-sm font-bold text-primary flex items-center gap-1 hover:gap-2 transition-all';
                link.href = 'NewsInDetail.html?id=' + encodeURIComponent(n.id);
                link.setAttribute('aria-label', 'Read: ' + n.title);
                link.innerHTML = 'Read More <span class="material-symbols-outlined text-[16px]">arrow_forward</span>';
                footRow.appendChild(link);
                if (n.reviewedDisplay) {
                    var rev = document.createElement('span');
                    rev.className = 'text-on-surface-variant';
                    rev.style.fontSize = '11px';
                    rev.textContent = 'Reviewed ' + n.reviewedDisplay;
                    footRow.appendChild(rev);
                }

                body.appendChild(meta); body.appendChild(h3); body.appendChild(footRow);
                art.appendChild(media); art.appendChild(body);
                grid.appendChild(art);
            });
        })();
    </script>
    <script>
            // Active top-nav highlight + page wiring (golden bar follows the current page).
            
        // Mobile top-nav hamburger toggle.
        (function () {
            const navToggle = document.getElementById('mobile-nav-toggle');
            const mobileNav = document.getElementById('mobile-nav');
            if (navToggle && mobileNav) {
                navToggle.addEventListener('click', () => mobileNav.classList.toggle('hidden'));
            }
        })();

        // Mobile filter drawer (off-canvas) toggle.
        (function () {
            const sidebar = document.getElementById('filter-sidebar');
            const backdrop = document.getElementById('filter-backdrop');
            const openBtn = document.getElementById('filter-open');
            const closeBtn = document.getElementById('filter-close');
            if (!sidebar || !backdrop) return;

            function openDrawer() {
                sidebar.classList.add('translate-x-0');
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
            function closeDrawer() {
                sidebar.classList.add('-translate-x-full');
                sidebar.classList.remove('translate-x-0');
                backdrop.classList.add('hidden');
                document.body.style.overflow = '';
            }
            if (openBtn) openBtn.addEventListener('click', openDrawer);
            if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
            backdrop.addEventListener('click', closeDrawer);
            // Reset drawer state when growing to desktop width.
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 1024) {
                    backdrop.classList.add('hidden');
                    document.body.style.overflow = '';
                }
            });
        })();

        // News filtering: sidebar checkboxes + search box filter the cards, and the pager
        // pages through what is left (PER_PAGE cards a page).
        (function () {
            const grid = document.getElementById('news-grid');
            const empty = document.getElementById('news-empty');
            const emptyHint = document.getElementById('news-empty-hint');
            const countEl = document.getElementById('news-count');
            const chipsEl = document.getElementById('news-chips');
            const search = document.getElementById('news-search');
            const resetBtn = document.getElementById('reset-filters');
            const pager = document.getElementById('news-pager');
            if (!grid) return;

            const PER_PAGE = 9;
            const clean = t => (t || '').replace(/\s+/g, ' ').trim();
            const cards = Array.from(grid.querySelectorAll('article'));

            // Add a location tag to each card, in the same row as the date (pushed right).
            cards.forEach(card => {
                const h3 = card.querySelector('h3');
                const state = h3 ? clean((h3.dataset.state || '').split(',')[0]) : '';
                const timeEl = card.querySelector('time');
                const metaRow = timeEl ? timeEl.closest('div') : null;
                if (state && metaRow && !metaRow.querySelector('.location-tag')) {
                    const tag = document.createElement('span');
                    tag.className = 'location-tag ml-auto flex items-center gap-1 text-label-md text-on-surface-variant';
                    tag.innerHTML = '<span class="material-symbols-outlined text-[16px] text-secondary">location_on</span>' + state;
                    metaRow.appendChild(tag);
                }
            });

            // Map each filter section heading to the card data-attribute it filters.
            const GROUP_ATTR = { 'News Categories': 'category', 'States': 'state', 'Timeline': 'timeline' };

            // Collect every filter checkbox along with its group attribute + value.
            const filters = [];
            document.querySelectorAll('#filter-sidebar section').forEach(section => {
                const heading = section.querySelector('h3');
                const attr = heading && GROUP_ATTR[clean(heading.textContent)];
                if (!attr) return;
                section.querySelectorAll('label').forEach(label => {
                    const box = label.querySelector('input[type="checkbox"]');
                    const span = label.querySelector('span');
                    if (box && span) filters.push({ attr, box, value: clean(span.textContent) });
                });
            });

            // What each filter group is called on a chip.
            const GROUP_LABEL = { category: 'Category', state: 'State', timeline: 'Timeline' };

            // "7 news items", or "3 of 7 news items" once something is filtered out,
            // plus the slice on screen when there is more than one page of them.
            function renderCount(hits, from, to) {
                if (!countEl) return;
                if (!hits) { countEl.textContent = 'No news items match'; return; }
                let text = hits === cards.length
                    ? cards.length + (cards.length === 1 ? ' news item' : ' news items')
                    : hits + ' of ' + cards.length + ' news items';
                if (hits > PER_PAGE) {
                    text += ' \u00b7 showing ' + (from + 1) + '\u2013' + Math.min(to, hits);
                }
                countEl.textContent = text;
            }

            function chipFor(item) {
                const chip = document.createElement('span');
                chip.className = 'news-chip';
                const label = document.createElement('i');
                label.textContent = item.label;
                const text = document.createElement('span');
                text.textContent = item.text;
                const off = document.createElement('button');
                off.type = 'button';
                off.setAttribute('aria-label', 'Remove filter: ' + item.label + ' ' + item.text);
                off.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">close</span>';
                off.addEventListener('click', function () { item.off(); applyFilters(); });
                chip.appendChild(label);
                chip.appendChild(text);
                chip.appendChild(off);
                return chip;
            }

            function renderChips(query) {
                if (!chipsEl) return;
                const items = [];
                filters.forEach(function (f) {
                    if (!f.box.checked) return;
                    items.push({
                        label: GROUP_LABEL[f.attr] || '', text: f.value,
                        off: function () { f.box.checked = false; }
                    });
                });
                if (query) {
                    items.push({
                        label: 'Search', text: clean(search.value),
                        off: function () { search.value = ''; }
                    });
                }
                chipsEl.innerHTML = '';
                chipsEl.hidden = !items.length;
                if (!items.length) return;
                items.forEach(function (item) { chipsEl.appendChild(chipFor(item)); });
                if (items.length < 2) return;
                const clearAll = document.createElement('button');
                clearAll.type = 'button';
                clearAll.className = 'news-chips-clear';
                clearAll.textContent = 'Clear all';
                clearAll.addEventListener('click', function () {
                    filters.forEach(function (f) { f.box.checked = false; });
                    if (search) search.value = '';
                    applyFilters();
                });
                chipsEl.appendChild(clearAll);
            }

            // Two categories have no stories yet, and one of them has a page of its
            // own, so the empty state says where to look instead of stopping dead.
            function renderEmptyHint(active) {
                if (!emptyHint) return;
                const on = (active.category || []);
                let html = '';
                if (on.indexOf('Events') > -1) {
                    html = 'Events are published on their own page: ' +
                        '<a class="font-bold text-primary hover:underline" href="Event.html">Events</a>.';
                } else if (on.indexOf('Tenders & bids') > -1) {
                    html = 'No tender or bid notice has been published here yet. ' +
                        '<a class="font-bold text-primary hover:underline" href="Announcements.html">Announcements</a> ' +
                        'carries the calls and deadlines issued so far.';
                }
                emptyHint.innerHTML = html;
                emptyHint.classList.toggle('hidden', !html);
            }

            function cardValues(card, attr) {
                const h3 = card.querySelector('h3');
                return (h3 ? (h3.dataset[attr] || '') : '').split(',').map(clean).filter(Boolean);
            }

            let page = 1;

            function matches(card, active, query) {
                for (const attr in active) {
                    const values = cardValues(card, attr);
                    if (!active[attr].some(v => values.includes(v))) return false;
                }
                if (query) {
                    const h3 = card.querySelector('h3');
                    if (!clean(h3 ? h3.textContent : '').toLowerCase().includes(query)) return false;
                }
                return true;
            }

            function btn(label, opts) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'w-10 h-10 flex items-center justify-center border border-outline-variant hover:bg-surface-container-low transition-colors';
                if (opts.icon) b.innerHTML = '<span class="material-symbols-outlined text-[20px]">' + opts.icon + '</span>';
                else b.textContent = label;
                if (opts.aria) b.setAttribute('aria-label', opts.aria);
                if (opts.current) b.setAttribute('aria-current', 'page');
                if (opts.disabled) b.disabled = true;
                if (opts.go) b.addEventListener('click', () => { page = opts.go; render(true); });
                return b;
            }

            function renderPager(pages) {
                if (!pager) return;
                pager.innerHTML = '';
                pager.hidden = pages <= 1;
                if (pages <= 1) return;
                pager.appendChild(btn('', { icon: 'chevron_left', aria: 'Previous page', disabled: page === 1, go: page - 1 }));
                for (let p = 1; p <= pages; p++) {
                    if (pages > 7 && p !== 1 && p !== pages && Math.abs(p - page) > 1) {
                        if (!pager.lastChild || pager.lastChild.tagName !== 'SPAN') {
                            const dots = document.createElement('span');
                            dots.className = 'px-2 text-on-surface-variant';
                            dots.textContent = '...';
                            pager.appendChild(dots);
                        }
                        continue;
                    }
                    pager.appendChild(btn(String(p), { aria: 'Page ' + p, current: p === page, go: p }));
                }
                pager.appendChild(btn('', { icon: 'chevron_right', aria: 'Next page', disabled: page === pages, go: page + 1 }));
            }

            function render(scroll) {
                // Checked values grouped by attribute (OR within a group, AND across groups).
                const active = {};
                filters.forEach(f => { if (f.box.checked) (active[f.attr] = active[f.attr] || []).push(f.value); });
                const query = clean(search ? search.value : '').toLowerCase();

                const hits = cards.filter(card => matches(card, active, query));
                const pages = Math.max(1, Math.ceil(hits.length / PER_PAGE));
                page = Math.min(Math.max(1, page), pages);
                const from = (page - 1) * PER_PAGE, to = from + PER_PAGE;

                cards.forEach(card => card.classList.add('hidden'));
                hits.slice(from, to).forEach(card => card.classList.remove('hidden'));
                if (empty) empty.classList.toggle('hidden', hits.length !== 0);
                if (!hits.length) renderEmptyHint(active);
                renderCount(hits.length, from, to);
                renderChips(query);
                renderPager(hits.length ? pages : 0);

                if (window.ScrollTrigger) window.ScrollTrigger.refresh();
                if (scroll) {
                    const header = document.querySelector('main > div.mb-10') || grid;
                    const y = header.getBoundingClientRect().top + window.scrollY - 90;
                    if (window.scrollY > y) window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
                }
            }

            function applyFilters() { page = 1; render(false); }

            filters.forEach(f => f.box.addEventListener('change', applyFilters));
            if (search) search.addEventListener('input', applyFilters);
            if (resetBtn) resetBtn.addEventListener('click', () => {
                filters.forEach(f => { f.box.checked = false; });
                if (search) search.value = '';
                applyFilters();
            });

            applyFilters();
        })();

        // Filter panel hide / show on desktop (the panel's own header button collapses it;
        // the Filters button above the title brings it back). Phones keep the drawer.
        (function () {
            const body = document.body;
            const sidebar = document.getElementById('filter-sidebar');
            const openBtn = document.getElementById('filter-open');
            const head = sidebar && sidebar.querySelector('.filter-sticky > div');
            if (!sidebar || !head) return;
            const desktop = window.matchMedia('(min-width: 1024px)');

            const hideBtn = document.createElement('button');
            hideBtn.type = 'button';
            hideBtn.className = 'rd-filters-hide';
            hideBtn.setAttribute('aria-controls', 'filter-sidebar');
            hideBtn.setAttribute('aria-label', 'Hide filters');
            hideBtn.title = 'Hide filters';
            hideBtn.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">left_panel_close</span>';
            const closeBtn = head.querySelector('#filter-close');
            head.insertBefore(hideBtn, closeBtn || null);

            function syncInert() {
                if (body.classList.contains('rd-filters-closed') && desktop.matches) sidebar.setAttribute('inert', '');
                else sidebar.removeAttribute('inert');
            }
            function setClosed(closed) {
                body.classList.toggle('rd-filters-closed', closed);
                if (openBtn) openBtn.setAttribute('aria-expanded', closed ? 'false' : 'true');
                syncInert();
                setTimeout(() => { if (window.ScrollTrigger) window.ScrollTrigger.refresh(); }, 600);
            }

            hideBtn.addEventListener('click', () => { setClosed(true); if (openBtn) openBtn.focus(); });

            // On desktop the Filters button reopens the panel; caught before the drawer handler.
            document.addEventListener('click', e => {
                if (!desktop.matches || !openBtn || !e.target.closest) return;
                if (e.target.closest('#filter-open') !== openBtn) return;
                e.preventDefault();
                e.stopImmediatePropagation();
                setClosed(false);
                hideBtn.focus();
            }, true);

            window.addEventListener('resize', () => {
                if (!desktop.matches && body.classList.contains('rd-filters-closed')) body.classList.remove('rd-filters-closed');
                syncInert();
            });
        })();

        // "View more" / "View less" toggle for the extra filter options.
        document.querySelectorAll('.filter-more-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const section = btn.closest('section');
                const more = section && section.querySelector('.more-options');
                if (!more) return;
                const collapsed = more.classList.toggle('hidden');
                const label = btn.querySelector('.more-label');
                if (label) label.textContent = collapsed ? 'View more' : 'View less';
                const icon = btn.querySelector('.material-symbols-outlined');
                if (icon) icon.textContent = collapsed ? 'keyboard_arrow_down' : 'keyboard_arrow_up';
                // UX-A11-08: the button keeps its own name ("Show all States
                // filters"); only its state changes, so a screen reader can tell
                // the three of them apart and hear whether each is open.
                btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            });
        });

        // Make each news card fully clickable — open the detail page on a click anywhere on the card.
        document.querySelectorAll('#news-grid article').forEach(card => {
            const link = card.querySelector('a[href]');
            if (!link) return;
            card.classList.add('cursor-pointer');
            card.addEventListener('click', e => {
                // Let the actual "Read More" link (or any link) behave normally.
                if (e.target.closest('a')) return;
                window.location.href = link.getAttribute('href');
            });
        });
    </script>

    <!-- Redesign motion layer: Lenis for smooth scroll, GSAP with ScrollTrigger and SplitText. Versions pinned. -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
    <script>
        /* =====================================================================
           REDESIGN MOTION LAYER - News.html, matched to DetailedSector.html

           Smooth scroll (Lenis) and scroll-driven motion (GSAP, ScrollTrigger,
           SplitText). Built to fail open: nothing is hidden until the libraries
           are confirmed present, everything hidden is tracked so an error can put
           it back, and with reduced motion asked for the script does nothing.
           The page's own scripts are left alone.

           On this page the news cards are NOT faded in: the filters and search
           show and hide them, and a card held back for a scroll entrance that a
           filter brings in later would stay invisible. The motion is the header
           entrance (the gold bar draws, the title's letters rise, the search
           follows), the reading progress and the cursor over the cards.
           ===================================================================== */
        (function () {
            /* ---- Page map: the only part that differs from page to page ----------
               Every selector may be null. Selectors are matched inside CFG.root, and
               anything inside the hero is left to the hero's own entrance. */
            var CFG = {
                root: 'main',            // content container (a wrapper when the page has no <main>)
                hero: 'main > div.mb-10', // the short page header: bar + title, search
                heroBg: null,            // inside hero: the photo/background element (settles, then parallax)
                heroCopy: null,          // inside hero: the copy wrapper (drifts and fades on scroll)
                heroEyebrow: null,       // inside hero: the small label above the title
                heroLede: 'div.w-1.h-10', // inside hero: the gold bar beside the title (its rule draws down)
                heroExtras: 'div.relative', // inside hero: the search field, which rises last
                heroParallax: false,     // false for a short page header
                scrollCue: false,        // the gold scroll cue (tall photo heroes only)
                eyebrowDashes: null,     // section eyebrow dashes (scaleX draw; the next sibling label fades in)
                headings: null,          // the only other headings are card titles, which the filters show and hide
                headingSkip: null,       // headings inside these are skipped (cards, hidden tabs, carousels, modals)
                read: null,              // paragraphs whose words light up in reading order
                rules: null,             // elements carrying a drawn gold rule (--rd-draw)
                cards: [],               // NEVER the news cards: the filters and search show and hide them
                counts: null,            // figures that count up
                cursorLabel: [{ sel: '#news-grid article', text: 'Read' }], // cursor only; the cards are never hidden
                magnetic: null,          // primary pill buttons that lean toward the pointer
                lenisPrevent: '#filter-sidebar' // the filter drawer scrolls on its own below 1024px
            };

            var html = document.documentElement;
            var hidden = [];
            var drawn = [];

            function releaseIntro() { html.classList.remove('rd-intro'); }

            var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce || !window.gsap || !window.ScrollTrigger) { releaseIntro(); return; }

            function start() {
                try {
                    run();
                } catch (err) {
                    if (window.console) console.warn('[rd] motion layer stopped:', err);
                    releaseIntro();
                    html.classList.remove('rd-motion');
                    if (hidden.length) gsap.set(hidden, { clearProps: 'opacity,transform,visibility' });
                    drawn.forEach(function (el) { el.style.removeProperty('--rd-draw'); });
                }
            }

            /* After the page's own DOMContentLoaded work, then the webfonts, which the
               line splits depend on - but never hold the hero back more than 900ms. */
            var started = false;
            function once() { if (!started) { started = true; start(); } }
            function afterParse() {
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(once);
                setTimeout(once, 900);
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', afterParse);
            else afterParse();

            function run() {
                gsap.registerPlugin(ScrollTrigger);
                var hasSplit = !!window.SplitText;
                if (hasSplit) gsap.registerPlugin(SplitText);

                var root = document.querySelector(CFG.root || 'main');
                if (!root) { releaseIntro(); return; }
                html.classList.add('rd-motion');

                var hero = CFG.hero === false ? null
                    : CFG.hero ? document.querySelector(CFG.hero)
                    : (Array.prototype.filter.call(root.children, function (el) { return el.tagName === 'SECTION'; })[0] || null);
                var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
                var EASE = 'expo.out';
                function all(scope, sel) { return sel ? Array.prototype.slice.call(scope.querySelectorAll(sel)) : []; }
                function inRest(sel) { return all(root, sel).filter(function (el) { return !(hero && hero.contains(el)); }); }
                function inHero(sel) { return hero && sel ? hero.querySelector(sel) : null; }

                /* ---- Smooth scroll ---------------------------------------------------- */
                var lenis = null;
                if (window.Lenis) {
                    lenis = new Lenis({ lerp: 0.09, smoothWheel: true, syncTouch: false });
                    lenis.on('scroll', ScrollTrigger.update);
                    gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
                    gsap.ticker.lagSmoothing(0);
                    window.__rdLenis = lenis;

                    all(document, '#mobile-nav, .nesp-dropdown' + (CFG.lenisPrevent ? ', ' + CFG.lenisPrevent : ''))
                        .forEach(function (el) { el.setAttribute('data-lenis-prevent', ''); });

                    /* In-page jumps glide and park clear of the sticky header, using the
                       offset nav.js measures. */
                    document.addEventListener('click', function (e) {
                        var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
                        if (!a || e.defaultPrevented) return;
                        var hash = a.getAttribute('href');
                        var target = hash.length > 1 ? document.getElementById(hash.slice(1)) : null;
                        if (!target) return;
                        e.preventDefault();
                        var offset = parseInt(getComputedStyle(html).getPropertyValue('--osip-nav-offset'), 10) || 100;
                        var y = target.getBoundingClientRect().top + window.scrollY - offset;
                        lenis.scrollTo(Math.max(0, y), { duration: 1.5, easing: function (x) { return 1 - Math.pow(1 - x, 4); } });
                        if (history.replaceState) history.replaceState(null, '', hash);
                    });
                }

                /* ---- Reading progress ------------------------------------------------- */
                var bar = document.createElement('div');
                bar.className = 'rd-progress';
                bar.setAttribute('aria-hidden', 'true');
                document.body.appendChild(bar);
                gsap.to(bar, { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: 0.4 } });

                /* ---- Hero: the photograph settles, the title's letters rise ----------- */
                if (hero) {
                    var bg = inHero(CFG.heroBg);
                    var copy = inHero(CFG.heroCopy);
                    var eyebrow = inHero(CFG.heroEyebrow);
                    var h1 = hero.querySelector('h1');
                    var lede = inHero(CFG.heroLede);
                    var extras = CFG.heroExtras ? all(hero, CFG.heroExtras) : [];
                    var intro = gsap.timeline({ defaults: { ease: EASE } });

                    if (bg) intro.fromTo(bg, { scale: 1.16 }, { scale: 1.04, duration: 2.6, ease: 'power3.out' }, 0);
                    if (eyebrow) intro.from(eyebrow, { opacity: 0, y: 12, duration: 1 }, 0.05);
                    if (h1) {
                        if (hasSplit) {
                            /* Words as well as letters, so a word never breaks across lines
                               mid-entrance. The split is undone once the letters land. */
                            var title = SplitText.create(h1, { type: 'words,chars', mask: 'chars', charsClass: 'rd-char' });
                            var each = Math.min(0.035, 1.1 / Math.max(1, title.chars.length));
                            intro.from(title.chars, { yPercent: 150, duration: 1.3, stagger: each, onComplete: function () { title.revert(); } }, 0.15);
                        } else {
                            intro.from(h1, { opacity: 0, y: 30, duration: 1.2 }, 0.15);
                        }
                    }
                    if (lede) {
                        intro.from(lede, { opacity: 0, y: 22, duration: 1.2 }, 0.55);
                        drawn.push(lede);
                        intro.fromTo(lede, { '--rd-draw': 0 }, { '--rd-draw': 1, duration: 1.6, ease: 'expo.inOut' }, 0.6);
                    }
                    if (extras.length) intro.from(extras, { opacity: 0, y: 16, duration: 1, stagger: 0.05, clearProps: 'transform' }, 0.8);
                    /* The start states above are already applied, so lifting the
                       pre-hide now cannot flash the finished hero first. */
                    releaseIntro();

                    if (CFG.heroParallax) {
                        if (bg) gsap.to(bg, { yPercent: 14, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
                        if (copy) gsap.to(copy, { yPercent: -18, opacity: 0.25, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
                    }

                    if (CFG.scrollCue) {
                        var cue = document.createElement('div');
                        cue.className = 'rd-scrollcue';
                        cue.setAttribute('aria-hidden', 'true');
                        cue.appendChild(document.createElement('span'));
                        hero.appendChild(cue);
                    }
                } else {
                    releaseIntro();
                }

                /* ---- Eyebrows: the gold dash draws, then the label ------------------- */
                inRest(CFG.eyebrowDashes).forEach(function (dash) {
                    var label = dash.nextElementSibling;
                    var tl = gsap.timeline({ scrollTrigger: { trigger: dash, start: 'top 90%', once: true } });
                    tl.from(dash, { scaleX: 0, duration: 1.1, ease: EASE });
                    if (label) tl.from(label, { opacity: 0, x: -8, duration: 0.9, ease: EASE, clearProps: 'transform' }, 0.15);
                    hidden.push(dash);
                    if (label) hidden.push(label);
                });

                /* ---- Headings: lines rise out of a mask ------------------------------- */
                inRest(CFG.headings).forEach(function (h) {
                    if (CFG.headingSkip && h.closest(CFG.headingSkip)) return;
                    if (!h.getClientRects().length) return; // not rendered (hidden panel)
                    if (!hasSplit) {
                        gsap.from(h, { opacity: 0, y: 24, duration: 1.1, ease: EASE, clearProps: 'transform', scrollTrigger: { trigger: h, start: 'top 88%', once: true } });
                        hidden.push(h);
                        return;
                    }
                    SplitText.create(h, {
                        type: 'lines', mask: 'lines', linesClass: 'rd-line', autoSplit: true,
                        onSplit: function (self) {
                            return gsap.from(self.lines, {
                                yPercent: 144, duration: 1.2, stagger: 0.09, ease: EASE,
                                scrollTrigger: { trigger: h, start: 'top 88%', once: true }
                            });
                        }
                    });
                });

                /* ---- Reading text: the words light up in reading order ----------------
                   Words wait faint rather than invisible; words only, no aria rewriting. */
                inRest(CFG.read).forEach(function (t) {
                    if (!hasSplit) {
                        gsap.from(t, { opacity: 0, y: 28, duration: 1.2, ease: EASE, clearProps: 'transform', scrollTrigger: { trigger: t, start: 'top 92%', once: true } });
                        hidden.push(t);
                        return;
                    }
                    var words = SplitText.create(t, { type: 'words', wordsClass: 'rd-word', tag: 'span', aria: 'none' }).words;
                    hidden = hidden.concat(words);
                    gsap.fromTo(words, { opacity: 0.2 }, {
                        opacity: 1, ease: 'none', stagger: 0.1,
                        scrollTrigger: { trigger: t, start: 'top 92%', end: 'bottom 68%', scrub: 0.5 }
                    });
                });

                /* ---- Gold rules draw down as the text beside them is read ------------ */
                inRest(CFG.rules).forEach(function (el) {
                    drawn.push(el);
                    gsap.fromTo(el, { '--rd-draw': 0 }, {
                        '--rd-draw': 1, ease: 'none',
                        scrollTrigger: { trigger: el, start: 'top 92%', end: 'bottom 68%', scrub: 0.5 }
                    });
                });

                /* ---- Cards arrive in the order they sit -------------------------------- */
                function batch(list, y, stagger) {
                    list = list.filter(function (el) { return el.getClientRects().length; });
                    if (!list.length) return;
                    gsap.set(list, { opacity: 0, y: y });
                    hidden = hidden.concat(list);
                    ScrollTrigger.batch(list, {
                        start: 'top 94%', once: true,
                        onEnter: function (els) {
                            gsap.to(els, { opacity: 1, y: 0, duration: 1.1, ease: EASE, stagger: stagger, overwrite: true, clearProps: 'transform' });
                        }
                    });
                }
                var cardEls = [];
                (CFG.cards || []).forEach(function (c) {
                    var list = inRest(c.sel);
                    batch(list, c.y == null ? 36 : c.y, c.stagger == null ? 0.09 : c.stagger);
                    list.forEach(function (el) { cardEls.push({ el: el, cursor: c.cursor, label: c.label }); });
                });

                /* ---- Figures count up to their value ----------------------------------
                   The real figure stays in a screen-reader copy while the digits run,
                   and the element is put back to its exact original text at the end. */
                function countUp(el) {
                    var final = el.textContent;
                    var flat = final.replace(/\s+/g, ' ').trim();
                    var parts = flat.split(/(\d[\d,]*(?:\.\d+)?)/);
                    if (parts.length < 3 || el.children.length) return;
                    var sr = document.createElement('span');
                    sr.className = 'rd-sr';
                    sr.textContent = flat;
                    var shown = document.createElement('span');
                    shown.setAttribute('aria-hidden', 'true');
                    el.textContent = '';
                    el.appendChild(sr);
                    el.appendChild(shown);
                    var state = { p: 0 };
                    gsap.to(state, {
                        p: 1, duration: 1.4, ease: 'power3.out',
                        onUpdate: function () {
                            shown.textContent = parts.map(function (piece, i) {
                                if (i % 2 === 0) return piece;
                                var places = (piece.split('.')[1] || '').length;
                                var n = parseFloat(piece.replace(/,/g, '')) * state.p;
                                return piece.indexOf(',') !== -1
                                    ? n.toLocaleString('en-US', { minimumFractionDigits: places, maximumFractionDigits: places })
                                    : n.toFixed(places);
                            }).join('');
                        },
                        onComplete: function () { el.textContent = final; }
                    });
                }
                inRest(CFG.counts).forEach(function (el) {
                    ScrollTrigger.create({ trigger: el, start: 'top 90%', once: true, onEnter: function () { countUp(el); } });
                });

                /* ---- Cursor ----------------------------------------------------------- */
                if (fine) {
                    var cursor = document.createElement('div');
                    cursor.className = 'rd-cursor';
                    cursor.setAttribute('aria-hidden', 'true');
                    var dot = document.createElement('div');
                    dot.className = 'rd-cursor-dot';
                    var label = document.createElement('span');
                    label.className = 'rd-cursor-label';
                    dot.appendChild(label);
                    cursor.appendChild(dot);
                    document.body.appendChild(cursor);
                    html.classList.add('rd-cursor-on');

                    var toX = gsap.quickTo(cursor, 'x', { duration: 0.5, ease: 'power3' });
                    var toY = gsap.quickTo(cursor, 'y', { duration: 0.5, ease: 'power3' });
                    var placed = false;
                    window.addEventListener('pointermove', function (e) {
                        if (e.pointerType && e.pointerType !== 'mouse') return;
                        if (!placed) { gsap.set(cursor, { x: e.clientX, y: e.clientY }); placed = true; }
                        toX(e.clientX);
                        toY(e.clientY);
                    }, { passive: true });

                    var off = function () { cursor.removeAttribute('data-mode'); };
                    function target(el, mode, text) {
                        el.setAttribute('data-rd-cursor', mode);
                        el.addEventListener('pointerenter', function () {
                            cursor.setAttribute('data-mode', mode);
                            cursor.setAttribute('data-look', mode);
                            label.textContent = text || '';
                        });
                        el.addEventListener('pointerleave', off);
                    }
                    (CFG.cursorLabel || []).forEach(function (c) { inRest(c.sel).forEach(function (el) { target(el, 'label', c.text); }); });
                    inRest('h2').forEach(function (h) { target(h, 'text'); });
                    cardEls.forEach(function (c) { if (c.cursor) target(c.el, c.cursor, c.label); });
                    document.documentElement.addEventListener('mouseleave', off);
                }

                /* ---- Magnetic buttons ------------------------------------------------- */
                if (fine && CFG.magnetic) {
                    all(document, CFG.magnetic).forEach(function (el) {
                        if (el.closest('.nesp-header')) return;
                        var mx = gsap.quickTo(el, 'x', { duration: 0.6, ease: 'power3' });
                        var my = gsap.quickTo(el, 'y', { duration: 0.6, ease: 'power3' });
                        el.addEventListener('pointermove', function (e) {
                            var r = el.getBoundingClientRect();
                            mx((e.clientX - r.left - r.width / 2) * 0.28);
                            my((e.clientY - r.top - r.height / 2) * 0.35);
                        });
                        el.addEventListener('pointerleave', function () { mx(0); my(0); });
                    });
                }

                window.addEventListener('load', function () { ScrollTrigger.refresh(); });
                ScrollTrigger.refresh();
            }
        })();
    </script>
</body>

</html>
