<!doctype html><html><body style="margin:0;background:#666">
<iframe id="f" width="1400" height="1000" src="homepage.html"></iframe>
<script>
var n=0;var t=setInterval(function(){
 if(++n>900){clearInterval(t);return;}
 var d=document.getElementById('f').contentDocument;if(!d)return;
 var el=d.querySelector('.osip-states-carousel');if(!el)return;
 var y=el.getBoundingClientRect().top+document.getElementById('f').contentWindow.scrollY-180;
 document.getElementById('f').contentWindow.scrollTo(0,y);
 if(n>60){clearInterval(t);}
},50);
</script></body></html>
